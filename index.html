<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">Bakery Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Mode select ------------------------------------------------------ -->
    <div id="modeScreen" class="mode-screen hidden">
        <div class="home-bg" aria-hidden="true"></div>

        <div class="mode-content">
            <h1 class="home-title" data-i18n="mode.heading">Bakery Box</h1>
            <p class="mode-subtitle" data-i18n="mode.subtitle"></p>

            <div class="mode-cards">
                <button class="mode-card" id="modeSoloBtn" type="button">
                    <span class="mode-card-badge hidden" data-i18n="mode.lastPlayed"></span>
                    <span class="mode-card-icon" aria-hidden="true">🍞</span>
                    <span class="mode-card-title" data-i18n="mode.solo.title"></span>
                    <span class="mode-card-desc" data-i18n="mode.solo.desc"></span>
                </button>

                <button class="mode-card" id="modeMultiBtn" type="button">
                    <span class="mode-card-badge hidden" data-i18n="mode.lastPlayed"></span>
                    <span class="mode-card-icon" aria-hidden="true">☕</span>
                    <span class="mode-card-title" data-i18n="mode.multi.title"></span>
                    <span class="mode-card-desc" data-i18n="mode.multi.desc"></span>
                </button>
            </div>

            <button class="mode-host-link" id="modeHostBtn" type="button" data-i18n="mode.hostLink"></button>
        </div>
    </div>

    <!-- Solo intro ------------------------------------------------------- -->
    <div id="homeScreen" class="home-screen hidden">
        <div class="home-bg" aria-hidden="true"></div>

        <button class="screen-back" data-back data-i18n="mode.back"></button>

        <div class="home-content">
            <canvas id="heroCanvas" class="hero-canvas" aria-hidden="true"></canvas>

            <h1 class="home-title" data-i18n="intro.heading">Bakery Box</h1>
            <p class="home-tagline">
                <span data-i18n="intro.rulesLine1"></span>
                <span data-i18n="intro.rulesLine2"></span>
            </p>
            <p class="home-timer-hint" data-i18n="intro.rulesLine3"></p>

            <button id="startBtn" class="btn-primary btn-hero" data-i18n="intro.start">Start Game</button>

            <details class="how-to-play">
                <summary data-i18n="intro.howToPlay">How to Play</summary>
                <ol>
                    <li data-i18n="intro.step1"></li>
                    <li data-i18n="intro.step2"></li>
                    <li data-i18n="intro.step3"></li>
                </ol>
            </details>
        </div>
    </div>

    <div class="lang-switcher global-lang" id="globalLang">
        <label for="langSelect" data-i18n="lang.label">Language</label>
        <select id="langSelect" class="lang-select"></select>
    </div>

    <!-- Countdown -------------------------------------------------------- -->
    <div id="countdownOverlay" class="countdown-overlay hidden">
        <span id="countdownValue">3</span>
    </div>

    <!-- Game ------------------------------------------------------------- -->
    <div class="game-container hidden">
        <header class="game-header">
            <div class="score-board">
                <span class="label" data-i18n="hud.score">ITEMS</span>
                <span class="value" id="scoreValue">0</span>
            </div>

            <div class="timer-display">
                <span class="label" data-i18n="hud.time">TIME</span>
                <span class="value" id="timerValue">60</span>
            </div>

            <div class="controls">
                <label class="toggle-switch">
                    <input type="checkbox" id="lightModeToggle">
                    <span class="slider"></span>
                    <span class="label-text" data-i18n="hud.lightMode">Light Mode</span>
                </label>
                <button id="resetBtn" class="btn-reset" data-i18n="hud.reset">Reset</button>
            </div>
        </header>

        <main class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="messageOverlay" class="message-overlay hidden">
                <div class="message-content result-card">
                    <div id="newRecordBadge" class="new-record hidden" data-i18n="result.newRecord">NEW RECORD!</div>
                    <h2 id="messageTitle" data-i18n="result.timeUp">Time's Up!</h2>

                    <div class="score-summary">
                        <div class="score-item">
                            <span class="label" data-i18n="result.score">SCORE</span>
                            <span class="value big" id="finalScore">0</span>
                        </div>
                        <div class="score-item">
                            <span class="label" data-i18n="result.best">BEST</span>
                            <span class="value" id="bestScore">0</span>
                        </div>
                    </div>

                    <div id="resultExtra" class="result-extra"></div>

                    <button id="playAgainBtn" class="btn-primary" data-i18n="result.playAgain">Play Again</button>
                    <button id="resultBackBtn" class="btn-ghost" data-back data-i18n="mode.back"></button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
